name: Desktop Build (exe + dmg)

on:
  workflow_dispatch:
  push:
    tags:
      - "desktop-v*"

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar_ext: .exe
            artifact_name: banana-desktop-windows
            bundle_glob: desktop/src-tauri/target/x86_64-pc-windows-msvc/release/bundle/**/*.exe
          - os: macos-14
            target: aarch64-apple-darwin
            sidecar_ext: ""
            artifact_name: banana-desktop-macos
            bundle_glob: desktop/src-tauri/target/aarch64-apple-darwin/release/bundle/**/*.dmg

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: |
            frontend/package-lock.json
            desktop/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux deps for Tauri
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf

      - name: Build frontend
        shell: pwsh
        run: |
          Set-Location frontend
          npm ci
          $env:VITE_API_BASE_URL = "http://127.0.0.1:5461"
          npm run build

      - name: Install backend deps and PyInstaller
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          pip install . pyinstaller

      - name: Build backend sidecar binary
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --onefile --name banana-backend backend/app.py
          New-Item -ItemType Directory -Force -Path desktop/src-tauri/binaries | Out-Null
          $src = "dist/banana-backend${{ matrix.sidecar_ext }}"
          $dst = "desktop/src-tauri/binaries/banana-backend-${{ matrix.target }}${{ matrix.sidecar_ext }}"
          Copy-Item $src $dst -Force

      - name: Install desktop deps
        shell: pwsh
        run: |
          Set-Location desktop
          npm install

      - name: Generate Tauri icons
        shell: pwsh
        run: |
          Set-Location desktop
          Remove-Item src-tauri/icons/icon.png,src-tauri/icons/icon.ico,src-tauri/icons/icon.icns -ErrorAction SilentlyContinue
          npx tauri icon ../frontend/public/logo.png ./src-tauri/icons

      - name: Build desktop app (Tauri)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: desktop
          args: --target ${{ matrix.target }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.bundle_glob }}
          if-no-files-found: error
